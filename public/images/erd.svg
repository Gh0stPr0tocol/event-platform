<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title description">
  <title id="title">Tukutane database entity relationship diagram</title>
  <desc id="description">Seven-table ERD showing county, category, user, venue, event, registration, and saved-event foreign-key relationships.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#718078"/>
    </marker>
    <style>
      .canvas { fill: #F8F7F3; }
      .card { fill: #fff; stroke: #D9DDD8; stroke-width: 2; rx: 12; }
      .head { fill: #1F6F4A; }
      .title { fill: #fff; font: 700 20px Arial, sans-serif; }
      .field { fill: #1E2420; font: 15px Arial, sans-serif; }
      .key { fill: #66736B; font: 700 12px Arial, sans-serif; }
      .relation { fill: none; stroke: #718078; stroke-width: 2.5; marker-end: url(#arrow); }
      .label { fill: #526057; font: 13px Arial, sans-serif; }
    </style>
  </defs>
  <rect class="canvas" width="1440" height="1050"/>

  <path class="relation" d="M340 130 H390 V48 H1010 V130 H1050"/>
  <path class="relation" d="M190 280 V420"/>
  <path class="relation" d="M700 280 V420"/>
  <path class="relation" d="M340 500 H550"/>
  <path class="relation" d="M1050 250 H970 V350 H830 V420"/>
  <path class="relation" d="M890 500 H1050"/>
  <path class="relation" d="M1210 280 V420"/>
  <path class="relation" d="M700 620 V760"/>
  <path class="relation" d="M1360 180 H1410 V720 H850 V760"/>
  <text class="label" x="555" y="39">users.region_id → regions.id</text>
  <text class="label" x="198" y="365">venues.region_id → regions.id</text>
  <text class="label" x="710" y="365">events.category_id → categories.id</text>
  <text class="label" x="385" y="490">events.venue_id → venues.id</text>
  <text class="label" x="875" y="340">events.created_by → users.id</text>
  <text class="label" x="930" y="490">registrations.event_id → events.id</text>
  <text class="label" x="1220" y="365">registrations.user_id → users.id</text>
  <text class="label" x="710" y="700">saved_events.event_id → events.id</text>
  <text class="label" x="1110" y="710">saved_events.user_id → users.id</text>

  <g transform="translate(40 80)">
    <rect class="card" width="300" height="200"/>
    <path class="head" d="M12 0 H288 Q300 0 300 12 V48 H0 V12 Q0 0 12 0Z"/>
    <text class="title" x="18" y="31">regions</text>
    <text class="key" x="18" y="78">PK</text><text class="field" x="65" y="78">id</text>
    <text class="field" x="65" y="110">name (unique)</text>
  </g>
  <g transform="translate(550 80)">
    <rect class="card" width="300" height="200"/>
    <path class="head" d="M12 0 H288 Q300 0 300 12 V48 H0 V12 Q0 0 12 0Z"/>
    <text class="title" x="18" y="31">categories</text>
    <text class="key" x="18" y="78">PK</text><text class="field" x="65" y="78">id</text>
    <text class="field" x="65" y="110">name (unique)</text>
  </g>
  <g transform="translate(1050 80)">
    <rect class="card" width="310" height="200"/>
    <path class="head" d="M12 0 H298 Q310 0 310 12 V48 H0 V12 Q0 0 12 0Z"/>
    <text class="title" x="18" y="31">users</text>
    <text class="key" x="18" y="78">PK</text><text class="field" x="65" y="78">id</text>
    <text class="key" x="18" y="110">FK</text><text class="field" x="65" y="110">region_id → regions.id</text>
    <text class="field" x="65" y="142">name, email, phone</text>
    <text class="field" x="65" y="174">password_hash, role</text>
  </g>
  <g transform="translate(40 420)">
    <rect class="card" width="300" height="200"/>
    <path class="head" d="M12 0 H288 Q300 0 300 12 V48 H0 V12 Q0 0 12 0Z"/>
    <text class="title" x="18" y="31">venues</text>
    <text class="key" x="18" y="78">PK</text><text class="field" x="65" y="78">id</text>
    <text class="key" x="18" y="110">FK</text><text class="field" x="65" y="110">region_id → regions.id</text>
    <text class="field" x="65" y="142">name, address</text>
  </g>
  <g transform="translate(550 420)">
    <rect class="card" width="340" height="200"/>
    <path class="head" d="M12 0 H328 Q340 0 340 12 V48 H0 V12 Q0 0 12 0Z"/>
    <text class="title" x="18" y="31">events</text>
    <text class="key" x="18" y="78">PK</text><text class="field" x="65" y="78">id</text>
    <text class="key" x="18" y="110">FK</text><text class="field" x="65" y="110">category_id → categories.id</text>
    <text class="key" x="18" y="142">FK</text><text class="field" x="65" y="142">venue_id → venues.id</text>
    <text class="key" x="18" y="174">FK</text><text class="field" x="65" y="174">created_by → users.id</text>
  </g>
  <g transform="translate(1050 420)">
    <rect class="card" width="310" height="200"/>
    <path class="head" d="M12 0 H298 Q310 0 310 12 V48 H0 V12 Q0 0 12 0Z"/>
    <text class="title" x="18" y="31">registrations</text>
    <text class="key" x="18" y="78">PK</text><text class="field" x="65" y="78">id</text>
    <text class="key" x="18" y="110">FK</text><text class="field" x="65" y="110">user_id → users.id</text>
    <text class="key" x="18" y="142">FK</text><text class="field" x="65" y="142">event_id → events.id</text>
    <text class="field" x="65" y="174">status</text>
  </g>
  <g transform="translate(550 760)">
    <rect class="card" width="300" height="170"/>
    <path class="head" d="M12 0 H288 Q300 0 300 12 V48 H0 V12 Q0 0 12 0Z"/>
    <text class="title" x="18" y="31">saved_events</text>
    <text class="key" x="18" y="78">PK/FK</text><text class="field" x="85" y="78">user_id → users.id</text>
    <text class="key" x="18" y="110">PK/FK</text><text class="field" x="85" y="110">event_id → events.id</text>
    <text class="field" x="85" y="142">saved_at</text>
  </g>
</svg>
